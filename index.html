-height:76px;resize:vertical}button{font:inherit}.btn{border:none;border-radius:8px;background:var(--blue);color:#fff;padding:11px 14px;font-weight:750;cursor:pointer}.btn.secondary{background:#e9f1fc;color:#145ca5}.btn.ghost{background:#fff;border:1px solid var(--line);color:#263b54}.btn.danger{background:#fff0f0;color:#ad3333}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.kpi{background:white;border:1px solid var(--line);border-radius:11px;padding:15px}.kpi strong{display:block;font-size:26px;color:#0f427d}.kpi span{font-size:12px;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{background:#f5f8fc;color:#405575}.alert{border-left:4px solid #d58b1a;background:#fff8e8;padding:10px 13px;border-radius:6px;margin:12px 0;color:#684712;font-size:13px}.success{border-left:4px solid #168857;background:#ebfff3;padding:10px 13px;border-radius:6px;margin:12px 0;color:#155a3c;font-size:13px}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted)}.hide{display:none!important}.progress{height:7px;background:#e3ebf3;border-radius:10px;overflow:hidden;margin-top:7px}.progress>div{height:100%;background:var(--blue)}.report{background:#fff;border:1px solid var(--line);padding:28px;border-radius:10px}.report h1{font-size:24px}.report .section{margin-top:23px}.report p{white-space:pre-wrap}.note{font-size:12px;color:var(--muted)}.demoGuide{background:linear-gradient(120deg,#0d335b,#155a9c);color:white;padding:19px 22px;border-radius:13px;margin-bottom:17px}.demoGuide p{margin:6px 0 0;color:#d7e8fa;line-height:1.5}.demoGuide .btn{background:white;color:#124f8e}.demoGuide .btn.secondary{background:#285c8b;color:white;border:1px solid #6085a8}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.steps span{background:#ffffff1d;border:1px solid #ffffff3d;border-radius:99px;padding:5px 9px;font-size:12px}.sampleActions{background:#eff6ff;border:1px solid #c9def7;border-radius:11px;padding:14px;margin:14px 0}.sampleActions h3{margin:0 0 6px}.sampleActions p{margin:0 0 10px}.sampleActions .btn{margin:3px 5px 3px 0}.history{border-left:2px solid #c5d9ed;padding-left:13px}.history div{margin:9px 0;font-size:12px}.demoWatermark{color:#b45417;font-weight:750}.btn:disabled{opacity:.48;cursor:not-allowed}.jobsteps{background:#f8fafc;padding:10px;border-radius:9px;border:1px solid var(--line)}@media(max-width:850px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}@media(max-width:550px){.shell{padding:12px}.grid,.grid3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}header{padding:14px}.nav button{flex:1 1 auto}}@media print{header,.nav,.noprint,.sidebar,.toolbar{display:none!important}body{background:#fff}.shell{padding:0;max-width:100%}.layout{display:block}.panel{border:none;box-shadow:none}.report{border:none;padding:0}}

</style></head><body><header><div><strong>◈ Repair Report Pro</strong><small>Valve Service Edition • Functional sales demonstration</small></div><span class="badge">DEMO • Sample data</span></header><div class="shell"><nav class="nav noprint" id="tabs"><button data-tab="dashboard" class="active">Overview</button><button data-tab="intake">Advisor intake</button><button data-tab="technician">Technician workspace</button><button data-tab="time">Time & labor</button><button data-tab="review">Advisor review</button><button data-tab="report">Customer report</button></nav><div id="app"></div></div><script>
const KEY='rrp_valve_prototype_v3_time';const storage=(()=>{try{let k='__rrp_storage_test';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage}catch(e){let m={};return {getItem:k=>m[k]||null,setItem:(k,v)=>{m[k]=v}}}})();const SAMPLE=[{id:'WO-1042',tag:'FCV-204',customer:'Demo Chemical Plant',site:'Unit 2',device:'Fisher control valve',serial:'',actuator:'Pneumatic diaphragm',complaint:'Valve not responding consistently to command signal',scope:'Inspect valve and actuator; document findings and recommend next steps',status:'Inspection',percent:35,priority:'Normal',assigned:'Technician A',findings:'',action:'',verification:'Not performed',testing:'',parts:[],tools:['Valve lifting fixture'],notes:'',hold:'',review:'Pending',created:'2026-11-07'},{id:'WO-1043',tag:'FCV-204',customer:'Demo Chemical Plant',site:'Unit 2',device:'Positioner',serial:'',actuator:'',complaint:'Evaluate positioner operation',scope:'Diagnostic-only work order associated with FCV-204',status:'Not started',percent:0,priority:'Normal',assigned:'Technician A',findings:'',action:'',verification:'Not performed',testing:'',parts:[],tools:[],notes:'',hold:'Awaiting diagnostic access',review:'Pending',created:'2026-11-07'},{id:'WO-1050',tag:'PSV-118',customer:'Demo Energy Facility',site:'Utility area',device:'Pressure safety valve',serial:'',actuator:'N/A',complaint:'Scheduled valve inspection',scope:'Inspect and document valve condition; record test results if performed',status:'Not started',percent:0,priority:'Normal',assigned:'Unassigned',findings:'',action:'',verification:'Not performed',testing:'',parts:[],tools:[],notes:'',hold:'',review:'Pending',created:'2026-11-07'}];
let state;try{state=JSON.parse(storage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.jobs)){let previous;try{previous=JSON.parse(storage.getItem('rrp_valve_prototype_v2'))}catch(e){}state=previous&&Array.isArray(previous.jobs)?previous:{jobs:structuredClone(SAMPLE),selected:'WO-1042',tab:'dashboard'}};state.timeEntries=state.timeEntries||[];state.screenSessions=state.screenSessions||[];state.activeTimer=state.activeTimer||null;state.noteLibrary=Array.isArray(state.noteLibrary)?state.noteLibrary:[];const FISHER_STARTER_NOTES=[{"title":"Fisher-informed · Packing — observed leakage","body":"Inspection of the stem packing area identified [describe observed leakage/location]. Packing type and applicable adjustment or replacement requirements: [confirm].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Packing — stem surface condition","body":"The exposed valve stem surface was inspected for nicks, scratches, and other visible damage. Observed condition: [record actual findings].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Valve trim — condition inspection","body":"Valve plug, seat ring, and accessible guiding surfaces were inspected. Observed wear, erosion, deposits, or other conditions: [document components and evidence].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Body / bonnet gasket — replacement","body":"The [identify gasketed joint] was opened during service. Gasket replacement performed: [confirm type and part]. Reassembly details: [record actual work].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Valve trim — recommendation","body":"Based on the documented condition of [component], recommend [specific inspection, measurement, repair, or replacement] subject to applicable service requirements and customer authorization.","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Actuator — diaphragm inspection","body":"The actuator diaphragm and associated casing were inspected for [describe inspection scope]. Observed condition: [record findings; do not assume pressure integrity].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Actuator — stem travel / bench set","body":"Actuator travel and loading pressure were evaluated against the applicable nameplate and equipment requirements. Recorded travel: [value/unit]; observed loading-pressure range: [value/unit]; conclusion: [document].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Actuator — corrective action","body":"Work performed on the actuator: [identify component and specific corrective action]. Adjustment or replacement details: [record]. Follow-up functional verification: [record separately].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Positioner — supply and output","body":"Instrument supply pressure and positioner output response were checked. Supply pressure: [value/unit]; output response: [readings/observations]; applicable acceptance basis: [reference].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Positioner — travel calibration","body":"Positioner travel calibration was [performed/not performed]. Device model/revision and calibration method: [record]. As-left travel response: [record observed results].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Valve diagnostics — friction / dead band","body":"Diagnostic evaluation of valve travel response was [performed/not performed]. Friction, dead band, or other observed characteristics: [record measured values and test conditions].","reference":"Emerson/Fisher technical terminology; original draft"},{"title":"Fisher-informed · Functional test — verification record","body":"Post-service functional testing was [performed/not performed]. Test procedure and acceptance criteria: [reference]. Actual measured results: [record]. Final verification: [pass/fail/not determined].","reference":"Emerson/Fisher technical terminology; original draft"}];
const VERIFIED_TECH_REFERENCES=[
{model:'Fisher easy-e ET',category:'Valve body and trim',title:'Valve/trim identification',url:'https://www.emerson.com/en/final-control/products/fisher-et'},
{model:'Fisher 657 / 667',category:'Diaphragm actuator',title:'657 and 667 actuator descriptions',url:'https://www.emerson.com/en-us/catalog/fisher-657-and-667'},
{model:'Fisher 667 Size 80 / 100',category:'Diaphragm actuator',title:'Instruction manual D100311X012',url:'https://www.emerson.com/is/content/emerson/en/final-control/flow-controls/documents/d100311x012-instruction-manual-667-diaphragm-actuators-size-80-and-100-fisher.pdf'},
{model:'FIELDVUE DVC6200',category:'Digital valve controller',title:'Instrument product information',url:'https://www.emerson.com/en/final-control/products/fisher-dvc6200'},
{model:'FIELDVUE DVC6200 SIS',category:'Digital valve controller',title:'Instruction manual D103557X012',url:'https://www.emerson.com/is/content/emerson/en/final-control/flow-controls/documents/instruction-manual-fisher-fieldvue-dvc6200-sis-digital-valve-controller-en.pdf'},
{model:'Emerson valve diagnostics',category:'Diagnostic testing',title:'Diagnostic terminology',url:'https://www.emerson.com/en/final-control/catalog/products-and-software/valve-software/control-valve-diagnostics'}
];
function technicalReferenceLibrary(){return `<div class="panel" style="margin-top:16px"><h3>Technical reference library</h3><p class="sub">Official Emerson product information and manuals. Confirm the exact model, size, revision, and configuration before applying any technical procedure or acceptance criterion.</p><div class="grid">${VERIFIED_TECH_REFERENCES.map(r=>`<div style="border:1px solid #dce4ee;border-radius:9px;padding:12px"><b>${esc(r.model)}</b><p class="sub">${esc(r.category)}</p><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a></div>`).join('')}</div><p class="note">These reference links are informational. They do not establish that a particular procedure was performed or a test passed.</p></div>`}
if(!state.fisherStarterNotesSeeded){const existing=new Set(state.noteLibrary.map(x=>x.title));for(const item of FISHER_STARTER_NOTES){if(!existing.has(item.title))state.noteLibrary.push(item)}state.fisherStarterNotesSeeded=true;storage.setItem(KEY,JSON.stringify(state))}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), save=()=>storage.setItem(KEY,JSON.stringify(state)), job=()=>state.jobs.find(j=>j.id===state.selected)||state.jobs[0], opt=(vals,v)=>vals.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join(''), box=(label,value,type='text',name=label)=>`<label class="field">${esc(label)}<input data-field="${esc(name)}" type="${type}" value="${esc(value)}"></label>`,area=(label,value,name)=>`<label class="field">${esc(label)}<textarea data-field="${esc(name)}">${esc(value)}</textarea></label>`, sel=(label,value,vals,name)=>`<label class="field">${esc(label)}<select data-field="${esc(name)}">${opt(vals,value)}</select></label>`;
function change(tab){if(state.tab!==tab){persistVisibleFields();flushView();state.tab=tab;startView()}save();render()}function picker(){return `<div class="panel sidebar noprint"><h2>Work orders</h2><input id="searchJobs" placeholder="Search by tag, WO, customer..." oninput="filterJobs(this.value)"><div id="joblist">${joblist('')}</div><div class="toolbar"><button class="btn secondary" onclick="change('intake')">+ New work order</button></div><p class="note">Separate work orders under the same tag have independent status, findings and reports.</p></div>`}function joblist(q){return state.jobs.filter(j=>[j.id,j.customerRef||'',j.tag,j.customer].join(' ').toLowerCase().includes(q.toLowerCase())).map(j=>`<button class="job ${j.id===state.selected?'selected':''}" onclick="selectJob('${esc(j.id)}')"><div class="flex"><b>${esc(j.id)}</b><span class="pill">${j.percent}%</span></div><small>${esc(j.customerRef||'No customer reference')} · ${esc(j.tag)} · ${esc(j.customer)}</small><small>${esc(j.status)}</small><div class="progress"><div style="width:${j.percent}%"></div></div></button>`).join('')||'<p class="sub">No matching work orders</p>'}function filterJobs(q){$('#joblist').innerHTML=joblist(q)}function selectJob(id){persistVisibleFields();flushView();state.selected=id;startView();save();render()}
function panel(content){return `<div class="layout">${picker()}<section class="panel">${content}</section></div>`}function missing(j){let a=[];if(!j.serial)a.push('Valve / equipment serial number');if(!j.findings)a.push('Inspection or diagnostic findings');if(!j.action)a.push('Repair / corrective action or “No action performed”');if(j.verification==='Not performed'&&!j.testing)a.push('Testing outcome or reason testing was not performed');if(j.verification==='Pass'&&!j.testing)a.push('Supporting test details for the pass result');return a}function dashboard(){let n=state.jobs.length,done=state.jobs.filter(j=>j.status==='Complete').length,hold=state.jobs.filter(j=>!!j.hold).length;return `<div class="kpis"><div class="kpi"><strong>${n}</strong><span>Open + complete WOs</span></div><div class="kpi"><strong>${done}</strong><span>Complete WOs</span></div><div class="kpi"><strong>${hold}</strong><span>On hold / dependency noted</span></div><div class="kpi"><strong>${new Set(state.jobs.map(j=>j.tag)).size}</strong><span>Unique equipment tags</span></div></div><div class="panel"><div class="flex"><div><h2>Work-order progress</h2><p class="sub">Valve shop view with independent work orders, even when they share an equipment tag.</p></div><button class="btn secondary" onclick="exportData()">Export backup JSON</button></div><div style="overflow:auto"><table><thead><tr><th>Our work order</th><th>Customer reference</th><th>Equipment tag</th><th>Customer</th><th>Status</th><th>Progress</th><th>Hold</th></tr></thead><tbody>${state.jobs.map(j=>`<tr><td><button class="btn ghost" onclick="selectJob('${esc(j.id)}');change('technician')">${esc(j.id)}</button></td><td>${esc(j.customerRef||'—')}</td><td>${esc(j.tag)}</td><td>${esc(j.customer)}</td><td>${esc(j.status)}</td><td>${j.percent}%</td><td>${esc(j.hold||'—')}</td></tr>`).join('')}</tbody></table></div><div class="toolbar"><button class="btn" onclick="startWalkthrough()">▶ Start guided mock job</button><button class="btn secondary" onclick="change('intake')">Create work order</button><button class="btn secondary" onclick="change('time')">Review labor tracking</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">Import backup JSON</button><button class="btn danger" onclick="resetDemo()">Reset demo data</button><input type="file" id="importFile" accept="application/json" class="hide" onchange="importData(this)"></div><p class="note">Demo data is stored locally in this browser. This is not a multi-user service, and is not suitable for confidential customer records.</p></div>`}
function intake(){let j=job();return panel(`<h2>Service advisor intake</h2><p class="sub">Capture scope and asset details once. The technician receives a focused worksheet.</p><div class="toolbar"><button class="btn" onclick="newJob()">+ Create new work order</button><span class="badge">Editing ${esc(j.id)}</span></div><div class="grid">${box('Our work order',j.id,'text','id')}${box('Customer work order / reference number',j.customerRef||'','text','customerRef')}${box('Equipment tag',j.tag,'text','tag')}${box('Customer',j.customer,'text','customer')}${box('Plant / area',j.site,'text','site')}${box('Valve / equipment type',j.device,'text','device')}${box('Serial number',j.serial,'text','serial')}${box('Actuator / accessories',j.actuator,'text','actuator')}${sel('Assigned technician',j.assigned||'Unassigned',[...new Set(['Unassigned','Alex Morgan (Demo)','Jordan Lee (Demo)','Taylor Brooks (Demo)','Technician A','Demo Technician',j.assigned].filter(Boolean))],'assigned')}${box('Valve size / rating',j.sizeRating||'','text','sizeRating')}${box('Manufacturer / model',j.model||'','text','model')}</div><div class="grid" style="margin-top:12px">${area('Customer complaint',j.complaint,'complaint')}${area('Requested scope / instructions',j.scope,'scope')}</div><div class="toolbar"><button class="btn" onclick="saveFields()">Save intake</button><button class="btn secondary" onclick="saveFields();change('technician')">Go to technician workspace →</button></div><p class="note">Use the same equipment tag on another work order when scope is split. Each record stays independent.</p>`)}
// Reusable repair-note templates are drafts, not verified job findings.
function repairNoteLibrary(){return `<div class="panel" style="margin-top:18px;background:#f8fbff"><h3>Reusable repair notes</h3><p class="sub">Start with Fisher-informed wording examples or save your own. Insert a draft into the selected work-order field, replace bracketed placeholders, and confirm what actually happened before approval. These are original templates, not manufacturer-approved service instructions.</p><div class="grid"><label class="field">Template title<input id="noteTitle" type="text" placeholder="e.g., Packing wear explanation"></label><label class="field">Insert into<select id="noteTarget"><option value="notes">Technician notes / recommendations</option><option value="findings">Observed condition / diagnostics</option><option value="action">Corrective action performed</option></select></label></div><label class="field">Template text<textarea id="noteTemplateText" placeholder="Write reusable wording here. Leave job-specific details for the technician to confirm."></textarea></label><div class="toolbar"><button class="btn secondary" onclick="saveRepairTemplate()">Save new note template</button></div>${state.noteLibrary.length?'<div class="history">'+state.noteLibrary.map((t,i)=>`<div style="padding:10px 0"><b>${esc(t.title)}</b><p class="sub" style="white-space:pre-wrap">${esc(t.body)}</p><div class="toolbar"><button class="btn secondary" onclick="insertRepairTemplate(${i})">Insert into selected field</button><button class="btn ghost" onclick="editRepairTemplate(${i})">Edit template</button><button class="btn danger" onclick="deleteRepairTemplate(${i})">Delete</button></div></div>`).join('')+'</div>':'<p class="sub">No saved templates yet. Add your first reusable explanation above.</p>'}<p class="note">Templates are stored in this browser for the demo, not shared across technicians. Inserting one does not verify that the described condition or action occurred.</p></div>`}
function saveRepairTemplate(){let title=$('#noteTitle')?.value.trim(),body=$('#noteTemplateText')?.value.trim();if(!title||!body){alert('Enter both a template title and explanation.');return}if(!persistVisibleFields())return;state.noteLibrary.push({title,body});save();render();notify('Reusable note saved')}
function editRepairTemplate(i){let t=state.noteLibrary[i];if(!t)return;let title=prompt('Template title',t.title);if(title===null)return;let body=prompt('Template explanation',t.body);if(body===null)return;if(!title.trim()||!body.trim()){alert('Title and explanation cannot be blank.');return}if(!persistVisibleFields())return;state.noteLibrary[i]={title:title.trim(),body:body.trim()};save();render();notify('Template updated')}
function deleteRepairTemplate(i){if(!state.noteLibrary[i]||!confirm('Delete this reusable note template?'))return;if(!persistVisibleFields())return;state.noteLibrary.splice(i,1);save();render()}
function insertRepairTemplate(i){let t=state.noteLibrary[i],target=$('#noteTarget')?.value;if(!t||!['notes','findings','action'].includes(target))return;let field=document.querySelector('[data-field="'+target+'"]');if(!field)return;field.value=(field.value.trim()?field.value.trim()+'\n\n':'')+t.body;if(!persistVisibleFields())return;render();notify('Draft inserted — verify details for this job')}
function technician(){let j=job();return panel(`<div class="flex"><div><h2>Technician workspace</h2><p class="sub">${esc(j.id)} · Assigned: ${esc(j.assigned||'Unassigned')} · Customer ref: ${esc(j.customerRef||'Not provided')} · ${esc(j.tag)} · ${esc(j.device)}</p></div><span class="badge">Mobile-friendly entry</span></div><div class="alert"><b>Job request:</b> ${esc(j.complaint||'No complaint entered')}<br><b>Scope:</b> ${esc(j.scope||'No scope entered')}</div><div class="grid3">${sel('Job status',j.status,['Not started','Disassembly','Inspection','Awaiting parts','Repair','Reassembly','Testing','Complete','On hold'],'status')}${sel('Progress',String(j.percent),['0','10','25','35','50','60','75','90','100'],'percent')}${sel('Verification',j.verification,['Not performed','Pass','Fail','Not applicable'],'verification')}</div>${j.demo?`<div class="sampleActions"><h3>Live demonstration controls</h3><p class="sub">Use these one at a time while explaining how the technician captures work. All inserted values are explicitly fictional demonstration data.</p><button class="btn secondary" onclick="applyStage('inspect')">1 · Record inspection findings</button><button class="btn secondary" onclick="applyStage('repair')">2 · Record corrective action</button><button class="btn secondary" onclick="applyStage('test')">3 · Record verification & complete</button></div>`:''}${timerPanel(j)}<h3>Guided repair documentation</h3><div class="grid">${area('Observed condition / diagnostics',j.findings,'findings')}${area('Corrective action performed',j.action,'action')}${area('Test conditions, results, or why not tested',j.testing,'testing')}${area('Technician notes / recommendations',j.notes,'notes')}</div><div class="grid" style="margin-top:12px">${area('Parts needed or used (one per line)',j.parts.join('\n'),'parts')}${area('Special tools needed (one per line)',j.tools.join('\n'),'tools')}${area('Hold / vendor dependency / scope change',j.hold,'hold')}</div>${repairNoteLibrary()}${technicalReferenceLibrary()}<div class="toolbar"><button class="btn" onclick="saveFields()">Save technician update</button><button class="btn secondary" onclick="saveFields();change('review')">Send to advisor review →</button></div>${j.history&&j.history.length?`<h3>Work-order activity log</h3><div class="history">${j.history.map(h=>`<div>${esc(h.at)} — ${esc(h.text)}</div>`).join('')}</div>`:''}<p class="note">For the mock job, readings and repair actions are fictional. Real work requires actual observations and the applicable test standard.</p>`)}
function review(){let j=job(),m=missing(j);return panel(`<div class="flex"><h2>Advisor review</h2><span class="badge">${esc(j.review)}</span></div><p class="sub">The advisor checks technical completeness before publishing the customer report.</p>${m.length?`<div class="alert"><b>${m.length} item(s) requiring attention</b><ul>${m.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<div class="success">Core completeness checks passed. Advisor must still verify accuracy against job records.</div>'}${j.demo?'<div class="jobsteps">Sales demo: explain that incomplete documentation is flagged before the advisor can approve a customer-facing report.</div>':''}<h3>Work order summary</h3><table><tbody>${[['Our work order',j.id],['Customer work order / reference',j.customerRef||'Not provided'],['Tag',j.tag],['Complaint',j.complaint],['Findings',j.findings||'Missing'],['Action',j.action||'Missing'],['Testing',j.testing||'Missing'],['Verification',j.verification],['Hold',j.hold||'None recorded']].map(x=>`<tr><th style="width:170px">${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join('')}</tbody></table><div class="toolbar"><button class="btn secondary" onclick="change('technician')">← Request edits</button><button class="btn" onclick="approve()" ${m.length?'disabled title="Complete required fields first"':''}>Approve report</button><button class="btn ghost" onclick="change('report')">Preview report</button></div><p class="note">Approval is intentionally blocked if the minimum report fields are blank. A pass requires supporting test detail.</p>`)}
function report(){let j=job(),m=missing(j);return panel(`<div class="noprint"><div class="flex"><h2>Customer report preview</h2><span class="badge">${esc(j.review)}</span></div>${m.length?`<div class="alert">Draft only: ${m.length} completeness issue(s). Missing information is shown as “Not documented.”</div>`:'<div class="success">Completeness checks passed. Verify technical accuracy before sharing.</div>'}<div class="toolbar"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn secondary" onclick="change('review')">Advisor review</button></div></div><article class="report"><div class="flex"><div><h1>Valve Service Report</h1><p class="sub">Repair Report Pro · Generated from documented work-order data</p></div><span class="badge">${esc(j.review==='Approved'?'APPROVED':'DRAFT')}</span></div><hr><div class="grid"><p><b>Customer</b><br>${esc(j.customer)}</p><p><b>Our work order</b><br>${esc(j.id)}</p><p><b>Customer work order / reference</b><br>${esc(j.customerRef||'Not provided')}</p><p><b>Equipment tag</b><br>${esc(j.tag)}</p><p><b>Site / area</b><br>${esc(j.site||'Not documented')}</p><p><b>Equipment</b><br>${esc(j.device||'Not documented')}</p><p><b>Serial number</b><br>${esc(j.serial||'Not documented')}</p><p><b>Actuator / accessories</b><br>${esc(j.actuator||'Not documented')}</p><p><b>Current status</b><br>${esc(j.status)} (${j.percent}%)</p></div>${[['Requested scope',j.scope],['Reported issue',j.complaint],['Inspection / diagnostic findings',j.findings],['Corrective action',j.action],['Testing and verification',`${j.verification}${j.testing?' — '+j.testing:''}`],['Parts recorded',j.parts.join('; ')],['Special tools',j.tools.join('; ')],['Notes and recommendations',j.notes],['Hold / dependencies',j.hold],['Recorded task time (technician verification required)',(state.timeEntries||[]).filter(e=>e.jobId===j.id).map(e=>e.task+': '+e.minutes.toFixed(2)+' min ('+(e.verified?'Confirmed':'Unverified')+')').join('; ')]].map(x=>`<div class="section"><h3>${esc(x[0])}</h3><p>${esc(x[1]||'Not documented')}</p></div>`).join('')}<p class="note"><b>DEMONSTRATION RECORD — NOT FOR CUSTOMER USE.</b> Any staged results are fictional. For actual repairs, enter measured values and acceptance criteria from the applicable controlled procedures.</p></article>`)}
function persistVisibleFields(){
  let j=job(); if(!j)return;let fields=[...document.querySelectorAll('[data-field]')];if(!fields.length)return;
  let idInput=fields.find(e=>e.dataset.field==='id');if(idInput){let id=idInput.value.trim();if(!/^[A-Za-z0-9_-]{1,40}$/.test(id)||state.jobs.some(x=>x!==j&&x.id===id)){alert('Please enter a unique work order ID using letters, numbers, hyphens or underscores.');return false;}}
  fields.forEach(e=>{let k=e.dataset.field,v=e.value;if(k==='percent')v=Math.min(100,Math.max(0,Number(v)||0));if(k==='parts'||k==='tools')v=v.split(/\n|,/).map(s=>s.trim()).filter(Boolean);j[k]=v;});state.selected=j.id; if(j.review==='Approved'){j.review='Pending';}save();return true;
}
function bind(){document.querySelectorAll('[data-field]').forEach(e=>e.addEventListener('change',()=>{}))}function saveFields(){if(!persistVisibleFields())return;let id=job().id;render();notify('Changes saved for '+id)}function newJob(){persistVisibleFields();let id='WO-'+(Math.max(1100,...state.jobs.map(j=>Number(j.id.replace(/\D/g,''))||0))+1);let j={id,customerRef:'',tag:'',customer:'',site:'',device:'',serial:'',actuator:'',complaint:'',scope:'',status:'Not started',percent:0,priority:'Normal',assigned:'Unassigned',findings:'',action:'',verification:'Not performed',testing:'',parts:[],tools:[],notes:'',hold:'',review:'Pending',history:[],created:new Date().toISOString().slice(0,10)};state.jobs.push(j);state.selected=id;save();render()}function startWalkthrough(){
 if(!confirm('Create a new fictional control-valve job for the sales walkthrough? Your other work orders will remain available.'))return;
 persistVisibleFields();let count=state.jobs.filter(j=>j.demo).length+1;
 let id='DEMO-'+String(Date.now()).slice(-7);
 let j={id,customerRef:'',tag:'FCV-204',customer:'Summit Process Industries (fictional)',site:'Unit 2 — Process Area',device:'Globe control valve',model:'Fisher-style globe valve (fictional example)',sizeRating:'4 in / Class 300 (fictional)',serial:'DEMO-SN-204',actuator:'Pneumatic diaphragm / digital positioner',complaint:'Reported erratic valve travel during command changes.',scope:'Perform incoming stroke check, inspect valve/actuator/positioner, document findings, correct observed issue if authorized, verify operation, and prepare customer report.',status:'Not started',percent:0,priority:'Normal',assigned:'Demo Technician',findings:'',action:'',verification:'Not performed',testing:'',parts:[],tools:[],notes:'',hold:'',review:'Pending',created:new Date().toISOString().slice(0,10),demo:true,history:[{at:new Date().toLocaleString(),text:'Advisor created fictional demonstration work order'}]};
 state.jobs.unshift(j);state.selected=id;state.tab='intake';save();render();notify('Mock job created — begin with advisor intake');
}
function applyStage(stage){
 if(!persistVisibleFields())return;let j=job();if(!j.demo)return;
 if(stage==='inspect'){j.findings='FICTIONAL DEMO: As-received positioner response was inconsistent during commanded travel. Visual inspection identified a loose feedback linkage connection. No additional findings documented.';j.status='Inspection';j.percent=35;j.notes='Example technician note: review manufacturer procedure and obtain authorization before adjustment.';}
 if(stage==='repair'){j.action='FICTIONAL DEMO: Secured positioner feedback linkage connection and performed positioner calibration per assumed work scope. Actual maintenance steps must be documented on real jobs.';j.parts=['No replacement parts used — fictional example'];j.tools=['Travel-check equipment','Positioner calibration tools'];j.status='Repair';j.percent=75;}
 if(stage==='test'){j.testing='FICTIONAL DEMO — NOT REAL TEST DATA: Commanded travel 0 / 25 / 50 / 75 / 100%; observed travel 0 / 25 / 50 / 75 / 100%. Demo acceptance band ±2 percentage points. No pressure-boundary or seat leakage test performed under this example scope.';j.verification='Pass';j.status='Complete';j.percent=100;j.hold='';}
 j.review='Pending';j.history=j.history||[];j.history.unshift({at:new Date().toLocaleString(),text:({inspect:'Inspection findings entered',repair:'Corrective action and tools recorded',test:'Demonstration verification recorded; technician marked job complete'})[stage]});save();render();notify('Sample '+stage+' stage saved');
}
function approve(){let j=job();if(missing(j).length){alert('Resolve completeness issues before approval.');return}j.review='Approved';save();change('report')}function resetDemo(){if(!confirm('Reset all locally saved demo data?'))return;state={jobs:structuredClone(SAMPLE),selected:'WO-1042',tab:'dashboard',timeEntries:[],screenSessions:[],activeTimer:null};save();render()}function exportData(){let b=new Blob([JSON.stringify({version:2,jobs:state.jobs,timeEntries:state.timeEntries,screenSessions:state.screenSessions},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='repair-report-pro-demo-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.jobs)||!x.jobs.every(j=>j.id&&j.tag!==undefined))throw Error('Invalid backup');if(!confirm('Replace current demo records with imported records?'))return;state.jobs=x.jobs;state.timeEntries=Array.isArray(x.timeEntries)?x.timeEntries:[];state.screenSessions=Array.isArray(x.screenSessions)?x.screenSessions:[];state.activeTimer=null;state.selected=x.jobs[0].id;save();render()}catch(e){alert('Invalid backup file: '+e.message)}};r.readAsText(f)}function notify(s){let x=document.createElement('div');x.textContent=s;x.style='position:fixed;bottom:20px;right:20px;background:#123c6a;color:white;padding:11px 17px;border-radius:8px;z-index:50';document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}function guide(){let j=job();let intro=j&&j.demo?`<b>Guided mock job: ${esc(j.id)}</b><p>Use the tabs to walk through the entire repair, from advisor intake to customer report. Current work order: <b>${esc(j.tag)}</b> · ${esc(j.status)} · ${j.percent}%.</p><div class="steps"><span>1 Advisor intake</span><span>2 Technician entry</span><span>3 Advisor approval</span><span>4 Report / PDF</span></div><div class="toolbar"><button class="btn" onclick="change('technician')">Open technician worksheet</button><button class="btn secondary" onclick="change('review')">Review report</button></div>`:`<b>Sales demonstration — follow a complete valve repair</b><p>Create a fictional job and walk your customer through the system. Enter findings manually or use the sample-stage buttons to rehearse each feature.</p><div class="toolbar"><button class="btn" onclick="startWalkthrough()">▶ Start guided mock job</button></div>`;return '<div class="demoGuide noprint">'+intro+'</div>'}

// Labor timers represent technician-confirmed task time. Screen telemetry is separately labeled and is not labor time.
const TASKS=['Equipment identification','Safety / job preparation','Function testing','As-found diagnostics','Actuator decoupling','Actuator removal','Valve evaluation','Pipeline removal coordination','Valve removal / handling','Disassembly / inspection','Repair / reassembly','Calibration / final testing','Documentation / report','Travel','Other'];
const mins=ms=>Math.max(0,Math.round(ms/60000));
const duration=ms=>{let sec=Math.max(0,Math.floor(ms/1000));return `${Math.floor(sec/3600)}h ${String(Math.floor(sec%3600/60)).padStart(2,'0')}m ${String(sec%60).padStart(2,'0')}s`};
const timestamp=ms=>new Date(ms).toLocaleString();
const dayKey=ms=>{let x=new Date(ms);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')};
function finishTimer(){if(!state.activeTimer)return;let t=state.activeTimer,ended=Date.now();let item={id:'T'+ended+Math.random().toString(36).slice(2,6),jobId:t.jobId,task:t.task,start:t.start,end:ended,minutes:Math.round((ended-t.start)/60000*100)/100,notes:'',source:'Technician timer',verified:false};state.timeEntries.push(item);state.activeTimer=null;let j=state.jobs.find(x=>x.id===t.jobId);if(j){j.history=j.history||[];j.history.unshift({at:timestamp(ended),text:`Task timer stopped: ${t.task}, ${item.minutes.toFixed(2)} minutes (unverified)`})}save()}
function startTask(){let choice=document.getElementById('taskType');if(!choice)return;let task=choice.value;if(state.activeTimer)finishTimer();state.activeTimer={jobId:job().id,task,start:Date.now()};save();render()}
function stopTask(){finishTimer();render()}
function timerPanel(j){let t=state.activeTimer,here=t&&t.jobId===j.id;return `<div class="timepanel"><div class="flex"><h3 style="margin:0">Task time capture</h3><span class="badge">Labor ≠ screen time</span></div><p class="sub">Start a task when work begins. The timer continues while you put your phone away; stop it when you change tasks or pause work. Review entries before submitting a timesheet.</p>${t?`<div class="alert"><b>Running:</b> ${esc(t.task)} · ${esc(t.jobId)}<br><strong class="runningTime" data-start="${t.start}">${duration(Date.now()-t.start)}</strong></div>`:''}<div class="grid"><label class="field">Work activity<select id="taskType">${TASKS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><div class="field"><span>Time actions</span><div class="toolbar" style="margin:0"><button class="btn" onclick="startTask()">${t?'Switch / start task':'Start task'}</button><button class="btn secondary" onclick="stopTask()" ${!t?'disabled':''}>Stop / pause</button></div></div></div><div class="toolbar"><button class="btn ghost" onclick="change('time')">Review day's labor entries →</button></div></div>`}
function addManual(){let j=job(),task=document.getElementById('manualTask').value,raw=Number(document.getElementById('manualMinutes').value),note=document.getElementById('manualNote').value;if(!Number.isFinite(raw)||raw<=0||raw>1440){alert('Enter minutes greater than 0 and no more than 1440.');return}let now=Date.now();state.timeEntries.push({id:'M'+now,jobId:j.id,task,start:now-raw*60000,end:now,minutes:Math.round(raw*100)/100,notes:note,source:'Manual adjustment',verified:false});save();render()}
function editEntry(id){let e=state.timeEntries.find(x=>x.id===id);if(!e)return;let v=prompt('Correct total minutes for this task:',e.minutes);if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<0||n>1440){alert('Enter between 0 and 1440 minutes');return}let note=prompt('Reason or notes for this correction (recommended):',e.notes||'');if(note===null)return;e.minutes=Math.round(n*100)/100;e.notes=note;e.source='Edited / technician confirmed';e.verified=false;save();render()}
function toggleVerified(id){let e=state.timeEntries.find(x=>x.id===id);if(!e)return;e.verified=!e.verified;save();render()}
function deleteEntry(id){if(!confirm('Remove this labor entry?'))return;state.timeEntries=state.timeEntries.filter(x=>x.id!==id);save();render()}
function csvLabor(){let rows=[['Work order','Task','Start','End','Minutes','Source','Verified','Notes'],...state.timeEntries.map(e=>[e.jobId,e.task,timestamp(e.start),timestamp(e.end),e.minutes.toFixed(2),e.source,e.verified?'Yes':'No',e.notes||''])];let csv=rows.map(row=>row.map(s=>'"'+String(s).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='repair-report-pro-labor.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function time(){let j=job(),entries=state.timeEntries.filter(e=>e.jobId===j.id),today=dayKey(Date.now()),todayEntries=entries.filter(e=>dayKey(e.start)===today),total=entries.reduce((a,e)=>a+e.minutes,0),todayMin=todayEntries.reduce((a,e)=>a+e.minutes,0),confirmed=todayEntries.filter(e=>e.verified).reduce((a,e)=>a+e.minutes,0),t=state.activeTimer,sessionToday=state.screenSessions.filter(x=>x.jobId===j.id&&dayKey(x.start)===today).reduce((a,x)=>a+x.durationMs,0);let groups={};todayEntries.forEach(e=>groups[e.task]=(groups[e.task]||0)+e.minutes);return panel(`<div class="flex"><div><h2>Task time & end-of-day review</h2><p class="sub">${esc(j.id)} · ${esc(j.tag)} · ${today} · Designed for technician-confirmed time allocation</p></div><span class="badge">Review required</span></div><div class="kpis" style="margin-top:12px"><div class="kpi"><strong>${todayMin.toFixed(1)}</strong><span>Today: recorded min</span></div><div class="kpi"><strong>${confirmed.toFixed(1)}</strong><span>Today: confirmed min</span></div><div class="kpi"><strong>${total.toFixed(1)}</strong><span>All recorded min</span></div><div class="kpi"><strong>${(sessionToday/60000).toFixed(1)}</strong><span>App visible min*</span></div></div>${t?`<div class="alert"><b>Active task:</b> ${esc(t.task)} on ${esc(t.jobId)} · <span class="runningTime" data-start="${t.start}">${duration(Date.now()-t.start)}</span> <button class="btn secondary" onclick="stopTask()">Stop task</button></div>`:''}<div class="alert"><b>Important:</b> App activity only shows which screen was visible, not hands-on labor. Task timers may continue while the app is closed. Confirm interruptions, shared jobs and task allocation before using totals for billing or payroll.</div><h3>Today's work by function</h3>${Object.keys(groups).length?`<div style="overflow:auto"><table><thead><tr><th>Function</th><th>Recorded minutes</th></tr></thead><tbody>${Object.entries(groups).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">No time entries for today. Begin a task timer in Technician Workspace or add a manual entry.</p>'}<h3>Recorded task entries — all dates</h3><div style="overflow:auto"><table><thead><tr><th>Function / WO</th><th>Start / end</th><th>Time</th><th>Review</th><th>Actions</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${esc(e.task)}<small style="display:block" class="sub">${esc(e.source)} · ${esc(e.notes||'No note')}</small></td><td>${esc(timestamp(e.start))}<small style="display:block" class="sub">${esc(timestamp(e.end))}</small></td><td>${e.minutes.toFixed(2)} min</td><td><button class="btn ${e.verified?'secondary':'ghost'}" onclick="toggleVerified('${e.id}')">${e.verified?'✓ Confirmed':'Confirm'}</button></td><td><button class="btn ghost" onclick="editEntry('${e.id}')">Edit</button> <button class="btn danger" onclick="deleteEntry('${e.id}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="5">No entries yet</td></tr>'}</tbody></table></div><h3>Add work not captured by timer</h3><div class="grid3"><label class="field">Task<select id="manualTask">${TASKS.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="field">Minutes<input type="number" id="manualMinutes" min="0.01" max="1440" step="0.25" placeholder="e.g. 35"></label><label class="field">Reason / work performed<input id="manualNote" placeholder="e.g. Phone was unavailable"></label></div><div class="toolbar"><button class="btn" onclick="addManual()">Add manual time</button><button class="btn secondary" onclick="csvLabor()">Export labor CSV</button></div><p class="note">*Screen visibility sessions are best-effort browser observations. They are not included in labor totals. Unverified entries are not approved timesheets. All data stays in this browser and device.</p>`)}
// Passive app screen telemetry, distinct from labor; closes the last visible segment on tab/app changes.
let viewStarted=Date.now(),viewJob=state.selected,viewTab=state.tab;
function flushView(){if(!viewStarted)return;let now=Date.now(),ms=now-viewStarted;if(ms>250)state.screenSessions.push({jobId:viewJob,section:viewTab,start:viewStarted,end:now,durationMs:ms});if(state.screenSessions.length>2000)state.screenSessions=state.screenSessions.slice(-2000);viewStarted=null;save()}
function startView(){viewStarted=Date.now();viewJob=state.selected;viewTab=state.tab}
function tickClocks(){document.querySelectorAll('.runningTime').forEach(el=>{el.textContent=duration(Date.now()-Number(el.dataset.start))})}
setInterval(tickClocks,1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushView()}else startView()});
window.addEventListener('pagehide',flushView);

function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('#app').innerHTML=guide()+({dashboard,intake,technician,time,review,report}[state.tab]||dashboard)();bind()}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>change(b.dataset.tab)));render();
</script></body></html>
